# Автосборка Vici: APK для Android и установщик для Windows.
# Как выпустить версию: git tag v2026.09.18 && git push origin v2026.09.18
# Через ~20–30 минут на странице Releases появятся APK и exe: Obtainium предложит
# обновление на телефоне, а настольная версия обновится сама.
# Можно запустить и вручную: вкладка Actions → Release → Run workflow.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 2026.09.18'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Собираем Vici $VERSION"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Установить зависимости
        run: npm ci

      - name: Записать версию в package.json
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      - name: Подготовить Android-проект
        run: npx expo prebuild --clean --platform android --no-install
        env:
          CI: 1

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "vici-${{ steps.version.outputs.version }}.apk"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Vici ${{ steps.version.outputs.version }}
          files: vici-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true

  # Установщик для Windows: та же веб-версия приложения, упакованная в Electron.
  # Запускается после Android, чтобы релиз уже существовал и файлы легли в него
  desktop:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Записать версию
        run: node desktop/version-from-tag.js "${{ steps.version.outputs.version }}"

      - name: Собрать веб-версию
        run: npm run export:web

      - name: Перенести сборку в desktop/web
        run: node desktop/sync-web.js

      - name: Установить зависимости Electron
        working-directory: desktop
        run: npm ci

      - name: Собрать установщик
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Добавить установщик в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
