# Автосборка Vici для Android.
# Как выпустить версию: git tag v2026.09.18 && git push origin v2026.09.18
# Через ~20–30 минут на странице Releases появится APK, и Obtainium предложит обновление.
# Можно запустить и вручную: вкладка Actions → Android release → Run workflow.

name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 2026.09.18'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Собираем Vici $VERSION"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Установить зависимости
        run: npm ci

      - name: Записать версию в package.json
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      - name: Подготовить Android-проект
        run: npx expo prebuild --clean --platform android --no-install
        env:
          CI: 1

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "vici-${{ steps.version.outputs.version }}.apk"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Vici ${{ steps.version.outputs.version }}
          files: vici-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
