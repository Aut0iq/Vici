name: Test build

on:
  push:
    branches: ['test/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: echo "version=$(date +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код
        run: npm run eslint

      - name: Записать версию в package.json
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "${{ steps.version.outputs.version }}"

      - name: Подготовить Android-проект
        run: npx expo prebuild --clean --platform android --no-install
        env:
          CI: 1
          IS_DEV: "true"

      - name: Собрать APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "vici-test-${{ steps.version.outputs.version }}.apk"

      - name: Добавить APK в тестовый релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: Vici test
          prerelease: true
          files: vici-test-${{ steps.version.outputs.version }}.apk
